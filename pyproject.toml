[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-mule"
version = "0.1.0"
description = "A human-supervised autonomous software development system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["openai>=3.6,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
